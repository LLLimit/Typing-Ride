<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>逐字骑行 · 模型实拍</title><style>*{box-sizing:border-box}body{margin:0;background:#dbe7eb;font-family:'Microsoft YaHei',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.title{position:absolute;left:42px;top:34px;color:#173b55;pointer-events:none}.title small{font-size:12px;letter-spacing:5px;color:#548797}.title h1{font-size:32px;margin:10px 0}.title p{font-size:13px;color:#487185}.badge{position:absolute;bottom:30px;right:42px;letter-spacing:3px;font-size:12px;color:#487185}body.portrait .title,body.portrait .badge{display:none}</style><div class="title"><small>TYPE & RIDE / CHARACTER COLLECTION</small><h1></h1><p></p></div><div class="badge">游戏内实际 3D 模型</div><script type="module">
import * as T from 'three';
import {createCyclist,createCar,RIDER_SCALE} from '../src/models.ts';
import {RIDERS} from '../src/data.ts';
const q=new URLSearchParams(location.search),mode=q.get('type')||'rider',id=Number(q.get('id')||0),portrait=q.has('portrait'),roster=mode==='roster',character=q.get('pose')==='character';if(portrait)document.body.classList.add('portrait');
function characterPose(rider){
  // Show the real character geometry without the bicycle so the square silhouette can be reviewed.
  for(const child of rider.root.children)child.visible=child===rider.body||child instanceof T.Bone;
  rider.body.position.set(0,1.54,0);rider.body.rotation.set(0,0,0);
  const pudding=id===2,shoulderX=pudding?.64:.47,shoulderY=1.54+(pudding?.73:.64),shoulderZ=pudding?.19:.10;
  for(const side of [-1,1]){
    for(const [name,y]of [['upper-arm',shoulderY],['forearm',shoulderY-.55],['hand',shoulderY-1.12]]){const bone=rider.root.getObjectByName(`${name}-${side}`);bone.position.set(side*shoulderX,y,shoulderZ);bone.rotation.set(0,0,0);}
    for(const [name,y]of [['thigh',1.54],['shin',.83],['foot',.13]]){const bone=rider.root.getObjectByName(`${name}-${side}`);bone.position.set(side*.26,y,name==='foot'?.08:0);bone.rotation.set(0,0,0);}
  }
}
let previewCar;const previewRiders=[];
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(portrait?2:1.5);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#dbe7eb');const camera=new T.PerspectiveCamera(portrait?30:32,innerWidth/innerHeight,.1,100);
scene.add(new T.HemisphereLight('#eff8ff','#959b84',1.8));const sun=new T.DirectionalLight('#fff1d6',3.5);sun.position.set(5,9,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,far:30});sun.shadow.normalBias=.012;scene.add(sun);const fill=new T.DirectionalLight('#bce0ff',1.1);fill.position.set(-4,3,-3);scene.add(fill);
const gradient=new T.DataTexture(new Uint8Array([100,100,100,175,175,175,230,230,230,255,255,255]),4,1,T.RGBFormat);gradient.minFilter=gradient.magFilter=T.NearestFilter;gradient.needsUpdate=true;
const mat=new T.MeshToonMaterial({vertexColors:true,gradientMap:gradient});const edge=new T.MeshBasicMaterial({color:'#293944',side:T.BackSide});edge.onBeforeCompile=s=>s.vertexShader=s.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed += normal * .005;');
mat.onBeforeCompile=s=>s.fragmentShader=s.fragmentShader.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor.rgb * .08;');
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshToonMaterial({color:'#dbe7eb',gradientMap:gradient}));floor.rotation.x=-Math.PI/2;floor.position.y=-.027;floor.receiveShadow=true;scene.add(floor);
if(mode==='car'){
  document.querySelector('.title small').textContent='TYPE & RIDE / VEHICLE COLLECTION';
  const car=createCar(id,mat,edge);previewCar=car;scene.add(car.root);camera.position.set(5,3.1,6.6);camera.lookAt(0,.77,0);document.querySelector('h1').textContent=['街区两厢车','日式配送小货车','旅行版小轿车','日式出租车'][id];document.querySelector('p').textContent='轮拱 · 独立玻璃 · 分层灯组 · 细节座舱';
}else{
  for(const i of roster?[0,1,2]:[id]){const rider=createCyclist(i,mat,edge);previewRiders.push(rider);rider.root.scale.setScalar(RIDER_SCALE);if(roster)rider.root.position.x=(i-1)*2.3;scene.add(rider.root);rider.animate(.9,0,1.4);if(character)characterPose(rider);}
  if(portrait){if(id===1){camera.fov=34;camera.updateProjectionMatrix();camera.position.set(1.14,2.28,2.87);camera.lookAt(0,2.00,.025);}else{camera.position.set(1.05,2.1,2.37);camera.lookAt(0,1.83,.04);}}
  else if(roster){camera.position.set(1.3,3.2,8.1);camera.lookAt(0,1.0,0);}
  else{camera.position.set(3.2,2.45,4.9);camera.lookAt(0,1.15,0);}
  document.querySelector('h1').textContent=roster?'林小满 / 芒芒 / 布丁':RIDERS[id].name;document.querySelector('p').textContent=roster?'统一方块造型 · 平整切面与像素细节':RIDERS[id].description;
}
renderer.render(scene,camera);window.__artReady=true;
// Isolated QA controls, only available in this development model viewer.
window.__artFrame=(phase,standing=0,rotation=0)=>{
  for(const rider of previewRiders)character?characterPose(rider):rider.animate(phase,standing,phase*1.65);
  if(previewCar){previewCar.root.rotation.y=rotation;previewCar.wheels.forEach(w=>w.rotation.y=-phase);}
  renderer.render(scene,camera);return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,windows:previewCar?previewCar.root.children.filter(o=>o.name.startsWith('car-window-')).map(o=>({cast:o.castShadow,receive:o.receiveShadow,side:o.material.side})):[]};
};
if(q.has('motion'))renderer.setAnimationLoop(t=>window.__artFrame(t*.002,roster?.7:(q.has('standing')?1:0),previewCar?t*.00025:0));
</script></html>
